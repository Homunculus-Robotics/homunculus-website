<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body style="margin:0;background:var(--void);padding:26px">
<div id="root"></div>
<script type="text/babel">
const NS = window.HumunculusRobotics || window.Humunculus || Object.values(window).find(v => v && v.Button && v.Card) || {};
const { Button, Badge, Card } = NS;
function Demo(){
  return (
    <div style={{display:'flex',flexDirection:'column',gap:20}}>
      <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'center'}}>
        <Button variant="primary" mono>Request access</Button>
        <Button variant="signal">Talk to us</Button>
        <Button variant="outline">Embodiments</Button>
        <Button variant="ghost">Learn more</Button>
      </div>
      <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
        <Badge tone="green" live>Embodiment online</Badge>
        <Badge tone="gold">Series A</Badge>
        <Badge tone="neutral">Non-humanoid</Badge>
        <Badge tone="error">Fault</Badge>
      </div>
      <Card grid style={{maxWidth:320}}>
        <div className="hmc-label" style={{marginBottom:8}}>Embodiment IV</div>
        <div style={{fontFamily:'var(--font-serif)',fontSize:26,color:'var(--text-hi)',lineHeight:1.1}}>Four-arm surgical lattice</div>
      </Card>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
