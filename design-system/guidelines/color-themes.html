<!-- @dsCard group="Colors" viewport="780x230" name="Color Themes" subtitle="Phosphor (default) / Ultraviolet / Verdant — swap via data-hmc-theme, see tokens/themes.css" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--void);padding:22px;display:flex;gap:16px">
  <div data-hmc-theme="phosphor" style="flex:1;background:var(--void);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;display:flex;flex-direction:column;gap:14px">
    <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-low)">Phosphor · default</div>
    <div style="display:flex;gap:8px">
      <div style="flex:1;height:52px;border-radius:var(--radius-sm);background:var(--accent);box-shadow:var(--glow-accent)"></div>
      <div style="flex:1;height:52px;border-radius:var(--radius-sm);background:var(--signal);box-shadow:var(--glow-signal)"></div>
    </div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-mid)">Green accent, violet signal</div>
  </div>
  <div data-hmc-theme="ultraviolet" style="flex:1;background:var(--void);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;display:flex;flex-direction:column;gap:14px">
    <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-low)">Ultraviolet</div>
    <div style="display:flex;gap:8px">
      <div style="flex:1;height:52px;border-radius:var(--radius-sm);background:var(--accent);box-shadow:var(--glow-accent)"></div>
      <div style="flex:1;height:52px;border-radius:var(--radius-sm);background:var(--signal);box-shadow:var(--glow-signal)"></div>
    </div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-mid)">Violet base, green trace signal</div>
  </div>
  <div data-hmc-theme="verdant" style="flex:1;background:var(--void);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;display:flex;flex-direction:column;gap:14px">
    <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-low)">Verdant</div>
    <div style="display:flex;gap:8px">
      <div style="flex:1;height:52px;border-radius:var(--radius-sm);background:var(--accent);box-shadow:var(--glow-accent)"></div>
      <div style="flex:1;height:52px;border-radius:var(--radius-sm);background:var(--signal);box-shadow:var(--glow-signal)"></div>
    </div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-mid)">Green forward, violet held to hairlines</div>
  </div>
</body></html>
