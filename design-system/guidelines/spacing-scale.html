<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing Scale" subtitle="4px base unit; sp-1 → sp-9" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--void);padding:22px 24px;font-family:var(--font-mono)">
  <div style="display:flex;align-items:flex-end;gap:14px">
    <div style="text-align:center"><div style="width:4px;height:4px;background:var(--green-300);margin:0 auto 6px"></div><div style="font-size:10px;color:var(--text-low)">1·4</div></div>
    <div style="text-align:center"><div style="width:8px;height:8px;background:var(--green-300);margin:0 auto 6px"></div><div style="font-size:10px;color:var(--text-low)">2·8</div></div>
    <div style="text-align:center"><div style="width:16px;height:16px;background:var(--green-300);margin:0 auto 6px"></div><div style="font-size:10px;color:var(--text-low)">4·16</div></div>
    <div style="text-align:center"><div style="width:24px;height:24px;background:var(--green-300);margin:0 auto 6px"></div><div style="font-size:10px;color:var(--text-low)">5·24</div></div>
    <div style="text-align:center"><div style="width:32px;height:32px;background:var(--green-300);margin:0 auto 6px"></div><div style="font-size:10px;color:var(--text-low)">6·32</div></div>
    <div style="text-align:center"><div style="width:48px;height:48px;background:var(--green-400);margin:0 auto 6px"></div><div style="font-size:10px;color:var(--text-low)">7·48</div></div>
    <div style="text-align:center"><div style="width:64px;height:64px;background:var(--green-500);margin:0 auto 6px"></div><div style="font-size:10px;color:var(--text-low)">8·64</div></div>
    <div style="text-align:center"><div style="width:96px;height:96px;background:var(--green-600);margin:0 auto 6px"></div><div style="font-size:10px;color:var(--text-low)">9·96</div></div>
  </div>
</body></html>
