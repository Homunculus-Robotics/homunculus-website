<!-- @dsCard group="Colors" viewport="700x160" name="Text & Hairlines" subtitle="Warm off-white text tiers + blueprint linework on dark" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--void);padding:24px;font-family:var(--font-body)">
  <div style="display:flex;gap:32px;align-items:flex-start">
    <div style="flex:1">
      <div style="color:var(--text-hi);font-size:19px">text-hi — primary</div>
      <div style="color:var(--text-mid);font-size:19px">text-mid — secondary</div>
      <div style="color:var(--text-low);font-size:19px">text-low — tertiary</div>
      <div style="color:var(--text-faint);font-size:19px">text-faint — disabled</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:14px;padding-top:4px">
      <div style="height:0;border-top:1px solid var(--line-soft)"></div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-low)">line-soft</div>
      <div style="height:0;border-top:1px solid var(--line-strong)"></div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-low)">line-strong</div>
      <div style="height:0;border-top:1px solid var(--line-green)"></div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-low)">line-green · line-gold →</div>
      <div style="height:0;border-top:1px solid var(--line-gold)"></div>
    </div>
  </div>
</body></html>
