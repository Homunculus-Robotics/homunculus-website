<!-- @dsCard group="Colors" viewport="700x150" name="Gold Ramp — Signal" subtitle="Warm accent. Reserve for emphasis, alerts, single highlights — never large fields" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--void);padding:22px">
  <div style="display:flex;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border)">
    <div style="flex:1;height:96px;background:var(--gold-700)"></div>
    <div style="flex:1;height:96px;background:var(--gold-600)"></div>
    <div style="flex:1;height:96px;background:var(--gold-500)"></div>
    <div style="flex:1;height:96px;background:var(--gold-400);box-shadow:inset 0 0 0 2px #2a1c00"></div>
    <div style="flex:1;height:96px;background:var(--gold-300)"></div>
    <div style="flex:1;height:96px;background:var(--gold-200)"></div>
    <div style="flex:1;height:96px;background:var(--gold-100)"></div>
  </div>
  <div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--text-low);margin-top:8px;letter-spacing:.04em">
    <span>700</span><span>600</span><span>500</span><span style="color:var(--gold-400)">400·seed</span><span>300</span><span>200</span><span>100</span>
  </div>
</body></html>
