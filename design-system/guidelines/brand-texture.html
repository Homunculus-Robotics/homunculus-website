<!-- @dsCard group="Brand" viewport="700x200" name="Blueprint & Scanlines" subtitle="Signature surface texture: technical grid + CRT scanlines over the warm void" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--void);padding:20px;display:flex;gap:16px">
  <div style="flex:1;height:150px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--blueprint-grid),var(--surface-1);position:relative">
    <span class="hmc-label" style="position:absolute;left:12px;bottom:12px">blueprint-grid</span>
  </div>
  <div style="flex:1;height:150px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--field-glow),var(--surface-1);position:relative;overflow:hidden">
    <div style="position:absolute;inset:0;background:var(--scanlines)"></div>
    <span class="hmc-label" style="position:absolute;left:12px;bottom:12px">field-glow + scanlines</span>
  </div>
</body></html>
