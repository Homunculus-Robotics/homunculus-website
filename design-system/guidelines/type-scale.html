<!-- @dsCard group="Type" viewport="700x260" name="Type Scale" subtitle="Fluid display-forward scale, hero → micro" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--void);padding:18px 24px;font-family:var(--font-body);color:var(--text-hi)">
  <div style="display:flex;align-items:baseline;gap:14px"><span style="font-family:var(--font-display);font-size:56px">Hero</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-low)">--fs-hero</span></div>
  <div style="display:flex;align-items:baseline;gap:14px"><span style="font-family:var(--font-display);font-size:40px">Heading 1</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-low)">--fs-h1</span></div>
  <div style="display:flex;align-items:baseline;gap:14px"><span style="font-size:28px">Heading 2</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-low)">--fs-h2</span></div>
  <div style="display:flex;align-items:baseline;gap:14px"><span style="font-size:19px">Body large</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-low)">--fs-body-lg</span></div>
  <div style="display:flex;align-items:baseline;gap:14px"><span style="font-size:14px;color:var(--text-mid)">Small</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-low)">--fs-sm</span></div>
  <div style="display:flex;align-items:baseline;gap:14px"><span class="hmc-label">Micro label</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-low)">--fs-xs · tracking-label</span></div>
</body></html>
