<!-- @dsCard group="Colors" viewport="700x180" name="Brand Seeds" subtitle="The two given brand colors — green + gold" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--void);padding:22px;display:flex;gap:16px">
  <div style="flex:1;height:132px;border-radius:var(--radius-md);background:var(--hmc-green);position:relative;overflow:hidden;box-shadow:var(--glow-green)">
    <div style="position:absolute;inset:0;background:var(--scanlines);opacity:.4"></div>
    <div style="position:absolute;left:16px;bottom:14px;font-family:var(--font-mono);color:var(--paper)">
      <div style="font-size:13px;letter-spacing:.06em">HMC GREEN</div>
      <div style="font-size:13px;opacity:.85">#006818</div>
    </div>
  </div>
  <div style="flex:1;height:132px;border-radius:var(--radius-md);background:var(--hmc-gold);position:relative;overflow:hidden;box-shadow:var(--glow-gold)">
    <div style="position:absolute;left:16px;bottom:14px;font-family:var(--font-mono);color:#2a1c00">
      <div style="font-size:13px;letter-spacing:.06em">HMC GOLD</div>
      <div style="font-size:13px;opacity:.75">#FCC454</div>
    </div>
  </div>
</body></html>
