<!-- @dsCard group="Colors" viewport="700x150" name="Green Ramp — Phosphor" subtitle="OKLCH-lifted for legibility on near-black; 300 is the interactive default" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--void);padding:22px">
  <div style="display:flex;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border)">
    <div style="flex:1;height:96px;background:var(--green-950)"></div>
    <div style="flex:1;height:96px;background:var(--green-900)"></div>
    <div style="flex:1;height:96px;background:var(--green-700)"></div>
    <div style="flex:1;height:96px;background:var(--green-600)"></div>
    <div style="flex:1;height:96px;background:var(--green-500)"></div>
    <div style="flex:1;height:96px;background:var(--green-400)"></div>
    <div style="flex:1;height:96px;background:var(--green-300);box-shadow:inset 0 0 0 2px var(--paper)"></div>
    <div style="flex:1;height:96px;background:var(--green-200)"></div>
    <div style="flex:1;height:96px;background:var(--green-100)"></div>
  </div>
  <div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--text-low);margin-top:8px;letter-spacing:.04em">
    <span>950</span><span>900</span><span>700</span><span>600·seed</span><span>500</span><span>400</span><span style="color:var(--green-300)">300·UI</span><span>200</span><span>100</span>
  </div>
</body></html>
